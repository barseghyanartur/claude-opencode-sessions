name: release

# Triggered by `make release`, which pushes a vX.Y.Z tag.
# PyPI publishing uses trusted publishing (no token): configure it once at
# https://pypi.org/manage/account/publishing/ with
#   project: claude-opencode-sessions, workflow: release.yml, environment: pypi

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tag matches version
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - run: make version-check
      - run: uv sync && uv run pytest -q
      - run: uv build
      - run: make plugin-zip
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*.whl dist/*.tar.gz
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
